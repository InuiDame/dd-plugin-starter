name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DDPluginAuthor: ${{ vars.DDPluginAuthor || github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # 本工程不依赖任何外部包，因此不需要拉 DKUtil。
      # 如果自己的插件用到了 DKUtil，在这里 checkout 到 extern/DKUtil。
      - name: Configure
        run: xmake f -p windows -a x64 -m releasedbg -y

      - name: Build
        run: xmake -v

      # CI 不部署：没有 DDPath / DD_DEPLOY，after_build 直接 return。
      # CI 也不跑离线单测：demo_test 是 set_default(false)，xmake -v 不会构建它。
      # 要跑测试就在本地显式 build + 运行，或在这里加一步单独调用。
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dd-plugin-starter-${{ github.sha }}
          path: |
            build/windows/x64/releasedbg/*.dll
            build/windows/x64/releasedbg/*.pdb
            !build/windows/x64/releasedbg/compile.*.pdb
          if-no-files-found: error
          retention-days: 30
